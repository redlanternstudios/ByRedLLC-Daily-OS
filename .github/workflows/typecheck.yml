name: typecheck
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  tsc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install deps
        run: |
          if [ -f pnpm-lock.yaml ]; then
            corepack enable && pnpm install --frozen-lockfile
          elif [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
      - name: TypeScript check (non-blocking to deploys, surfaces errors here)
        run: npx tsc --noEmit
